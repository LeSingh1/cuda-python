name: zz-fork-pathfinder-probe

# Fork-only helper: runs the pure-Python cuda_pathfinder tests on Linux so that
# changes can be verified without CUDA hardware. Not intended for upstream.
on:
  push:
    branches:
      - "ci-probe"
      - "probe/**"
  workflow_dispatch:

jobs:
  pathfinder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cuda_pathfinder
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./cuda_pathfinder pytest
      - name: Show environment
        run: python -c "import sys, platform; print(sys.version); print(platform.platform())"
      - name: Run pathfinder tests
        run: python -m pytest cuda_pathfinder/tests -q -rs --no-header -p no:cacheprovider 2>&1
